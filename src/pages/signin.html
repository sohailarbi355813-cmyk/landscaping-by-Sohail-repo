<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Maplescape</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/svg+xml" href="../../assets/globe.svg" />
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #FDFBF7; }
    .font-display { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="text-[#1E2B1F] antialiased flex flex-col min-h-screen">

  <!-- Navbar -->
  <nav class="w-full z-50 transition-all duration-300 py-4 bg-[#1E2B1F] text-white shadow-sm">
    <div class="max-w-[1400px] mx-auto px-4 md:px-16 flex items-center justify-between">
      <a href="../../index.html" class="font-display text-2xl font-semibold tracking-tight">Maplescape</a>
      <div class="hidden md:flex items-center gap-6 text-sm font-medium">
        <a href="../../index.html" class="hover:text-[#BBD885] transition-colors">Home</a>
        <a href="about.html" class="hover:text-[#BBD885] transition-colors">About</a>
        <a href="contact.html" class="hover:text-[#BBD885] transition-colors">Contact</a>
        <a href="signin.html" class="text-[#BBD885]">Sign In</a>
        <a href="signup.html" class="px-5 py-2 bg-[#BBD885] text-[#1E2B1F] rounded-full font-bold uppercase tracking-wider text-xs hover:bg-[#A5C768] transition-colors">Sign Up</a>
      </div>
    </div>
  </nav>

  <main class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white p-8 md:p-10 rounded-[30px] shadow-xl border border-gray-100">
      
      <div class="text-center mb-8">
        <h1 class="font-display text-3xl font-medium mb-2">Welcome Back</h1>
        <p class="text-sm text-gray-500">Please sign in to your account</p>
      </div>

      <form action="#" method="POST" class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-bold text-gray-700 mb-2">Email</label>
          <input type="email" id="email" required
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#BBD885] transition-shadow">
        </div>

        <div>
          <label for="password" class="block text-sm font-bold text-gray-700 mb-2">Password</label>
          <input type="password" id="password" required
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#BBD885] transition-shadow">
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-[#BBD885] focus:ring-[#BBD885] border-gray-300 rounded">
            <label for="remember-me" class="ml-2 block text-sm text-gray-700">Remember me</label>
          </div>
          <div class="text-sm">
            <a href="#" class="font-semibold text-[#BBD885] hover:text-[#1E2B1F]">Forgot password?</a>
          </div>
        </div>

        <button type="submit" class="w-full py-4 bg-[#1E2B1F] text-white rounded-xl font-bold uppercase tracking-widest text-sm hover:bg-[#BBD885] hover:text-[#1E2B1F] transition-colors duration-300 mt-6">
          Sign In
        </button>
      </form>

      <div class="mt-8 text-center text-sm text-gray-500">
        Don't have an account? <a href="signup.html" class="font-semibold text-[#1E2B1F] hover:text-[#BBD885]">Sign Up</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#1E2B1F] text-white py-12 mt-auto">
    <div class="max-w-[1400px] mx-auto px-4 md:px-16 text-center text-white/40 text-xs">
      &copy; 2026 Maplescape Landscaping. All rights reserved.
    </div>
  </footer>

</body>
</html>
